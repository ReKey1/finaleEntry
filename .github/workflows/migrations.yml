# Applies anything in supabase/migrations/ that the database has not run yet.
#
# This is the free-tier way to keep the schema in Git. Supabase's own GitHub
# integration does the same job, but it is built on Branching, which spins up a
# throwaway Postgres per pull request and needs a paid plan.

name: Apply database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations.yml'
  # Lets you re-run it by hand from the Actions tab without pushing anything.
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    # This job only reads the checkout; it never writes back to the repository.
    permissions:
      contents: read

    env:
      # Authenticates the CLI to your Supabase account.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # `db push` connects straight to Postgres, so it needs the database
      # password — not the secret API key the form function uses.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `latest`: this step runs SQL against the production
      # database, so a new CLI release should be something you opt into by
      # bumping this line, not something that arrives on the next push.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link to the hosted project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        run: supabase db push
