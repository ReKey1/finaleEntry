# There is no build command on purpose. The page is plain static HTML and
# the function has no dependencies, so nothing needs compiling or bundling.
# Secrets stay out of the browser because they live in the function, not
# because a build step strips them.

[build]
  publish = "public"
  functions = "netlify/functions"

# Friendlier endpoint than /.netlify/functions/submit
[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # The allowances are exactly what the page loads: Google's font
    # stylesheets and font files, the Forms favicon from gstatic, and the
    # YouTube embed. connect-src 'self' is what keeps the answers going to
    # /api/submit and nowhere else.
    #
    # script-src needs 'unsafe-inline' because the page is one large inline
    # <script> and there is no build step to hash or nonce it. That is only
    # acceptable here because no user input is ever written into the DOM as
    # HTML — the client renders every value with textContent. If that ever
    # changes, this line has to be tightened first.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com; frame-src https://www.youtube-nocookie.com; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"
